<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Tập Giải Tích 3 - TuanHungDJ</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .auth-container { background: white; color: var(--text); padding: 2rem 3rem; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 1.5rem; }
        .logo h1 { color: var(--primary); margin: 0; font-size: 1.8rem; }
        .logo p { color: #64748b; font-size: 0.9rem; margin-top: 5px; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        
        .btn { width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 5px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .btn:hover { background-color: #1d4ed8; }
        
        .toggle-text { text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #475569; }
        .toggle-text span { color: var(--primary); cursor: pointer; font-weight: bold; }
        
        #message { text-align: center; margin-top: 1rem; font-weight: bold; font-size: 0.9rem; }
        .error { color: #ef4444; }
        .success { color: #22c55e; }
        .warning { color: #f59e0b; }

        /* Admin Panel Styles */
        .admin-btn { display: block; text-align: center; margin-top: 2rem; color: #94a3b8; font-size: 0.8rem; cursor: pointer; text-decoration: underline; transition: 0.3s;}
        .admin-btn:hover { color: #f59e0b; }
        
        /* Box Xác thực PIN */
        #adminAuth { display: none; background: #1e293b; padding: 1.5rem; border-radius: 8px; margin-top: 1.5rem; text-align: center; border: 2px solid #f59e0b;}
        #adminAuth input { width: 100%; padding: 10px; margin: 10px 0; text-align: center; font-size: 1.2rem; letter-spacing: 5px; border-radius: 4px; border: none; outline: none;}
        #adminAuth button { width: 100%; padding: 10px; background: #f59e0b; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.3s;}
        #adminAuth button:hover { background: #d97706; }
        
        /* Bảng điều khiển Admin */
        #adminPanel { display: none; background: #334155; padding: 1rem; border-radius: 8px; margin-top: 1rem; border: 2px solid #22c55e; max-height: 400px; overflow-y: auto;}
        .user-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #475569; font-size: 0.85rem;}
        
        .approve-btn { background: #22c55e; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold;}
        .approve-btn:hover { background: #16a34a; }
        
        .revoke-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-weight: bold;}
        .revoke-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="logo">
            <h1>TuanHungDJ</h1>
            <p>Hệ thống tự học Giải Tích 3 Độc Quyền</p>
        </div>

        <!-- FORM ĐĂNG NHẬP -->
        <div id="loginForm">
            <h2 style="text-align: center; margin-top: 0;">ĐĂNG NHẬP</h2>
            <div class="form-group">
                <label>Tên đăng nhập (Mã SV)</label>
                <input type="text" id="loginUsername" placeholder="Nhập mã sinh viên...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="loginPassword" placeholder="Nhập mật khẩu...">
            </div>
            <button class="btn" onclick="handleLogin()">VÀO HỌC NGAY</button>
            <div class="toggle-text">Chưa có tài khoản? <span onclick="toggleForm('register')">Đăng ký ngay</span></div>
        </div>

        <!-- FORM ĐĂNG KÝ -->
        <div id="registerForm" style="display: none;">
            <h2 style="text-align: center; margin-top: 0;">ĐĂNG KÝ HỌC</h2>
            <div class="form-group">
                <label>Họ và Tên</label>
                <input type="text" id="regFullName" placeholder="Nhập họ tên...">
            </div>
            <div class="form-group">
                <label>Tên đăng nhập (Mã SV)</label>
                <input type="text" id="regUsername" placeholder="Nhập mã sinh viên...">
            </div>
            <div class="form-group">
                <label>Mật khẩu</label>
                <input type="password" id="regPassword" placeholder="Tạo mật khẩu...">
            </div>
            <button class="btn" onclick="handleRegister()">GỬI DUYỆT TÀI KHOẢN</button>
            <div class="toggle-text">Đã có tài khoản? <span onclick="toggleForm('login')">Quay lại Đăng nhập</span></div>
        </div>

        <div id="message"></div>

        <!-- KHU VỰC DÀNH CHO ADMIN -->
        <span class="admin-btn" onclick="openAdminAuth()">🔧 Khu vực dành cho Admin</span>
        
        <!-- Box Xác Thực PIN -->
        <div id="adminAuth">
            <h4 style="margin: 0; color: #fcd34d;">🔒 BẢO MẬT ADMIN</h4>
            <p style="font-size: 0.8rem; color: #94a3b8; margin: 5px 0;">Nhập mã PIN để truy cập hệ thống quản lý.</p>
            <input type="password" id="adminPinInput" placeholder="••••••" maxlength="6">
            <button onclick="verifyAdminPin()">XÁC NHẬN</button>
            <p id="adminErrorMsg" style="color: #ef4444; font-size: 0.85rem; margin-top: 10px; margin-bottom: 0; display: none;"></p>
        </div>

        <!-- Bảng Quản Lý Của Admin -->
        <div id="adminPanel">
            <h4 style="margin-top: 0; color: #4ade80; border-bottom: 1px solid #475569; padding-bottom: 5px;">✅ Danh sách chờ duyệt:</h4>
            <div id="userList"></div>

            <h4 style="margin-top: 1.5rem; color: #38bdf8; border-bottom: 1px solid #475569; padding-bottom: 5px;">🎓 Học viên đang học:</h4>
            <div id="approvedList"></div>

            <button onclick="closeAdminPanel()" style="width: 100%; margin-top: 15px; padding: 8px; background: #64748b; border: none; color: white; border-radius: 4px; cursor: pointer; font-weight: bold;">Đóng Admin Panel</button>
        </div>

    </div>

    <!-- ================= NHÚNG THƯ VIỆN FIREBASE TỪ GOOGLE ================= -->
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

    <script>
        // 1. CẤU HÌNH FIREBASE CỦA RIÊNG BẠN (COPY TỪ FIREBASE CONSOLE DÁN VÀO ĐÂY)
        const firebaseConfig = {
    apiKey: "AIzaSyDt9CoUM6FiU_ImjYTDD1UwKEXcaxK0vuw",
    authDomain: "giai-tich-3-chuong-1-hust.firebaseapp.com",
    projectId: "giai-tich-3-chuong-1-hust",
    storageBucket: "giai-tich-3-chuong-1-hust.firebasestorage.app",
    messagingSenderId: "273977526322",
    appId: "1:273977526322:web:433839123a7ea3bab2942b",
    measurementId: "G-ERY22GZ58G"
  }
            apiKey: "AIzaSy_DAY_LA_MA_GIA_CUA_BAN_xxxx",
            authDomain: "hust-giaitich3.firebaseapp.com",
            projectId: "hust-giaitich3",
            storageBucket: "hust-giaitich3.appspot.com",
            messagingSenderId: "1234567890",
            appId: "1:1234567890:web:abcdef123456"
        };

        // 2. KHỞI TẠO FIREBASE VÀ KẾT NỐI DATABASE
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // ================= LOGIC SINH VIÊN (GIAO TIẾP VỚI ĐÁM MÂY) =================
        function toggleForm(type) {
            document.getElementById('message').innerText = "";
            if (type === 'register') {
                document.getElementById('loginForm').style.display = 'none';
                document.getElementById('registerForm').style.display = 'block';
            } else {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
            }
        }

        function showMessage(msg, type) {
            const msgBox = document.getElementById('message');
            msgBox.innerText = msg;
            msgBox.className = type;
        }

        // HÀM ĐĂNG KÝ HỌC
        async function handleRegister() {
            const fullname = document.getElementById('regFullName').value;
            const username = document.getElementById('regUsername').value;
            const password = document.getElementById('regPassword').value;

            if (!fullname || !username || !password) return showMessage("Vui lòng điền đủ thông tin!", "error");

            try {
                // Kiểm tra mã sinh viên đã tồn tại trên Firestore chưa
                const userDoc = await db.collection("users").doc(username).get();
                if (userDoc.exists) {
                    return showMessage("Mã sinh viên này đã được đăng ký!", "error");
                }

                // Ghi dữ liệu lên đám mây với status là 'pending'
                await db.collection("users").doc(username).set({
                    fullname: fullname,
                    password: password,
                    status: 'pending',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });

                showMessage("Đăng ký thành công! Vui lòng chờ Admin duyệt.", "success");
                setTimeout(() => toggleForm('login'), 3000);
            } catch (error) {
                showMessage("Lỗi kết nối máy chủ: " + error.message, "error");
            }
        }

        // HÀM ĐĂNG NHẬP
        async function handleLogin() {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            if (!username || !password) return showMessage("Vui lòng điền đủ thông tin!", "error");

            try {
                // Rút dữ liệu người dùng từ đám mây về
                const userDoc = await db.collection("users").doc(username).get();
                
                if (!userDoc.exists) return showMessage("Tài khoản không tồn tại!", "error");
                
                const userData = userDoc.data();
                if (userData.password !== password) return showMessage("Sai mật khẩu!", "error");
                
                // Xác thực các lớp kiểm duyệt
                if (userData.status === 'pending') {
                    return showMessage("Tài khoản ĐANG CHỜ DUYỆT. Vui lòng liên hệ Admin!", "warning");
                }
                if (userData.status === 'revoked') {
                    return showMessage("Tài khoản đã BỊ HỦY quyền truy cập khóa học!", "error");
                }

                if (userData.status === 'approved') {
                    // Cấp vé thông hành vào Session Storage như cũ
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('currentUser', userData.fullname);
                    window.location.href = 'ly_thuyet.html'; 
                }
            } catch (error) {
                showMessage("Lỗi kết nối máy chủ!", "error");
            }
        }

        // ================= LOGIC ADMIN (GIỮ NGUYÊN BẢO MẬT MÃ PIN) =================
        const ADMIN_PIN = "190922";
        const MAX_FAIL_ATTEMPTS = 3;

        function openAdminAuth() {
            if (localStorage.getItem('adminDeviceBanned') === 'true') {
                alert("🚫 THIẾT BỊ NÀY ĐÃ BỊ CẤM!");
                return;
            }
            const adminPanel = document.getElementById('adminPanel');
            const authBox = document.getElementById('adminAuth');
            
            if (adminPanel.style.display === 'block') {
                adminPanel.style.display = 'none';
            } else {
                authBox.style.display = authBox.style.display === 'none' ? 'block' : 'none';
                document.getElementById('adminPinInput').value = '';
                document.getElementById('adminErrorMsg').style.display = 'none';
            }
        }

        function verifyAdminPin() {
            const enteredPin = document.getElementById('adminPinInput').value;
            let failedAttempts = parseInt(localStorage.getItem('adminFailedAttempts') || '0');

            if (enteredPin === ADMIN_PIN) {
                localStorage.setItem('adminFailedAttempts', '0'); 
                document.getElementById('adminAuth').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                // Kích hoạt hàm lắng nghe dữ liệu từ Database
                renderUserListRealtime(); 
            } else {
                failedAttempts++;
                localStorage.setItem('adminFailedAttempts', failedAttempts);
                if (failedAttempts >= MAX_FAIL_ATTEMPTS) {
                    localStorage.setItem('adminDeviceBanned', 'true');
                    document.getElementById('adminAuth').style.display = 'none';
                    alert("🚨 BÁO ĐỘNG: Thiết bị đã bị đưa vào danh sách cấm!");
                } else {
                    document.getElementById('adminErrorMsg').style.display = 'block';
                    document.getElementById('adminErrorMsg').innerText = `Sai PIN! Còn ${MAX_FAIL_ATTEMPTS - failedAttempts} lần thử.`;
                }
            }
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').style.display = 'none';
        }

        // ================= LẮNG NGHE VÀ DUYỆT TỪ ĐÁM MÂY (REALTIME) =================
        function renderUserListRealtime() {
            // Hàm onSnapshot giúp web của bạn TỰ ĐỘNG nhận dữ liệu khi có 1 SV vừa đăng ký
            db.collection("users").onSnapshot((snapshot) => {
                let pendingHTML = '';
                let approvedHTML = '';

                snapshot.forEach((doc) => {
                    let username = doc.id;
                    let user = doc.data();
                    
                    if (user.status === 'pending') {
                        pendingHTML += `<div class="user-row" style="color: white;">
                            <span><strong>${user.fullname}</strong><br><span style="color:#94a3b8; font-size: 0.75rem;">MSSV: ${username}</span></span>
                            <button class="approve-btn" onclick="approveUser('${username}')">Duyệt</button>
                        </div>`;
                    } 
                    else if (user.status === 'approved') {
                        approvedHTML += `<div class="user-row" style="color: white;">
                            <span><strong>${user.fullname}</strong><br><span style="color:#94a3b8; font-size: 0.75rem;">MSSV: ${username}</span></span>
                            <button class="revoke-btn" onclick="revokeUser('${username}')">Hủy Học</button>
                        </div>`;
                    }
                });
                
                document.getElementById('userList').innerHTML = pendingHTML || "<i style='color:#94a3b8; font-size: 0.85rem;'>Không có tài khoản chờ duyệt.</i>";
                document.getElementById('approvedList').innerHTML = approvedHTML || "<i style='color:#94a3b8; font-size: 0.85rem;'>Chưa có học viên nào.</i>";
            });
        }

        // Hàm Đẩy dữ liệu cập nhật trạng thái "approved" lên Đám mây
        async function approveUser(username) {
            await db.collection("users").doc(username).update({
                status: 'approved'
            });
        }

        // Hàm Đẩy dữ liệu cập nhật trạng thái "revoked" lên Đám mây
        async function revokeUser(username) {
            if (confirm(`⚠️ HỦY KHÓA HỌC CỦA SINH VIÊN: ${username}?`)) {
                await db.collection("users").doc(username).update({
                    status: 'revoked'
                });
            }
        }
    </script>
</body>
</html>
</body>
</html>
